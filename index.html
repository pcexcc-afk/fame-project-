<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AxonAI - Генератор Картинок</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    :root { --bg: #0a0a0a; --text: #ffffff; --accent: #0a84ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Фон (Звездопад) */
    #starsCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    /* Основной контейнер */
    .app { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; width: 100%; padding: 20px; }
    
    .header { text-align: center; margin-bottom: 20px; margin-top: 20px; }
    .header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(90deg, #0a84ff, #bf5af2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: #888; font-size: 14px; margin-top: 5px; }

    /* Окно результата */
    .result-box { flex: 1; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 20px; position: relative; }
    .result-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .placeholder { color: #555; font-size: 16px; text-align: center; padding: 20px; }
    .loader { display: none; font-size: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Ввод и кнопка */
    .input-area { display: flex; gap: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
    .input-area input { flex: 1; background: none; border: none; color: white; font-size: 16px; outline: none; padding: 10px; }
    .input-area button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .input-area button:active { transform: scale(0.95); }
    .input-area button:disabled { background: #555; cursor: not-allowed; }
</style>
</head>
<body>

<canvas id="starsCanvas"></canvas>

<div class="app">
    <div class="header">
        <h1>AxonAI</h1>
        <p>Генератор картинок</p>
    </div>

    <div class="result-box" id="resultBox">
        <div class="placeholder" id="placeholder">Здесь появится твоя картинка...</div>
        <div class="loader" id="loader">⏳</div>
        <img id="resultImg" src="" alt="Результат">
    </div>

    <div class="input-area">
        <input type="text" id="promptInput" placeholder="Нарисуй кота в космосе..." onkeypress="if(event.key==='Enter') generateImage()">
        <button id="genBtn" onclick="generateImage()">Создать</button>
    </div>
</div>

<script>
    // --- ФОН (ЗВЕЗДОПАД) ---
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    for(let i=0; i<100; i++) {
        stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 2 + 1 });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            s.y += s.speed;
            if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
        });
        requestAnimationFrame(draw);
    }
    draw();

    // --- ГЕНЕРАЦИЯ КАРТИНКИ (POLLINATIONS) ---
    let isGenerating = false;

    async function generateImage() {
        if (isGenerating) return;
        
        const prompt = document.getElementById('promptInput').value.trim();
        if (!prompt) return alert('Напиши, что нарисовать!');

        const resultImg = document.getElementById('resultImg');
        const placeholder = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('genBtn');

        // Включаем загрузку
        isGenerating = true;
        btn.disabled = true;
        btn.innerText = 'Рисую...';
        resultImg.style.display = 'none';
        placeholder.style.display = 'none';
        loader.style.display = 'block';

        try {
            // Кодируем запрос для URL
            const encodedPrompt = encodeURIComponent(prompt);
            
            // Ссылка на Pollinations (без ключей)
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;

            // Создаем новый объект Image для загрузки
            const img = new Image();
            img.src = imageUrl;

            img.onload = () => {
                resultImg.src = imageUrl;
                resultImg.style.display = 'block';
                loader.style.display = 'none';
                isGenerating = false;
                btn.disabled = false;
                btn.innerText = 'Создать';
            };

            img.onerror = () => {
                alert("Ошибка генерации. Подожди 15 секунд и попробуй снова.");
                loader.style.display = 'none';
                placeholder.style.display = 'block';
                isGenerating = false;
                btn.disabled = false;
                btn.innerText = 'Создать';
            };

        } catch (e) {
            alert("Ошибка сети.");
            loader.style.display = 'none';
            placeholder.style.display = 'block';
            isGenerating = false;
            btn.disabled = false;
            btn.innerText = 'Создать';
        }
    }
</script>
</body>
</html>
