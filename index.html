<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация с картой</title>
    
    <!-- Подключение карт -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50; /* Темный фон для презентации */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        
        /* Слайд */
        .slide {
            background: white;
            color: #333;
            width: 80%;
            max-width: 900px;
            height: 80vh;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        h1 { margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; text-align: center; }

        /* Кнопка */
        .btn-map {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-map:hover { background-color: #2980b9; transform: scale(1.05); }

        /* Блок с картой (изначально скрыт) */
        #map-container {
            display: none;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            background: white;
        }

        #map { width: 100%; height: 90%; }
        
        /* Кнопка закрытия карты */
        .btn-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }
        .btn-close:hover { background: #c0392b; }
        
        .status-text { margin-top: 20px; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>

    <!-- Слайд 1 -->
    <div class="slide">
        <h1>Мое местоположение</h1>
        <p>Нажмите на кнопку ниже, чтобы определить ваше текущее положение на карте.</p>
        <button class="btn-map" onclick="showMap()">Открыть карту</button>
        <div id="status" class="status-text"></div>

        <!-- Блок с картой -->
        <div id="map-container">
            <button class="btn-close" onclick="closeMap()">✖ Закрыть карту</button>
            <div id="map"></div>
        </div>
    </div>

    <script>
        let map, marker;

        function showMap() {
            // Показываем блок карты
            document.getElementById('map-container').style.display = 'block';
            const status = document.getElementById('status');
            status.innerText = "Поиск спутников... Разрешите доступ к геопозиции.";

            // Инициализируем карту, только если её еще нет
            if (!map) {
                map = L.map('map').setView([48.8566, 2.3522], 13); // Временный центр (Париж)
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            }

            // Запрашиваем геолокацию
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        status.innerText = ""; // Убираем текст загрузки
                        map.setView([lat, lon], 16); // Центрируем на пользователе

                        // Удаляем старую метку, если есть
                        if (marker) map.removeLayer(marker);

                        // Ставим новую метку
                        marker = L.marker([lat, lon]).addTo(map)
                            .bindPopup('<b>Вы здесь!</b>')
                            .openPopup();
                    },
                    (error) => {
                        status.innerText = "Ошибка: Не удалось получить координаты. Разрешите доступ в браузере.";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                status.innerText = "Ваш браузер не поддерживает геолокацию.";
            }
        }

        function closeMap() {
            document.getElementById('map-container').style.display = 'none';
            document.getElementById('status').innerText = "";
        }
    </script>
</body>
</html>
