<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnoxGram</title>
<style>
:root{--bg:#0e0e10;--panel:#1c1c1e;--panel2:#2c2c2e;--text:#f2f2f7;--muted:#8e8e93;--accent:#6c5ce7;--gold:#ffd166;--green:#30d158;--red:#ff453a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;background:var(--panel2);border:1px solid #3a3a3c;border-radius:12px;color:var(--text);padding:12px 14px;width:100%;outline:none;font-size:15px}
.hidden{display:none!important}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#2a1e5c 0%,var(--bg) 60%);z-index:50;padding:20px}
.auth-card{width:100%;max-width:400px;background:rgba(28,28,30,.85);border:1px solid #333;border-radius:26px;padding:32px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo h1{font-size:26px}
.logo h1 span{color:var(--gold)}
.tabs{display:flex;background:var(--panel2);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;padding:10px;border-radius:11px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--accent);color:#fff}
.field{margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--accent),#8e6cf0);color:#fff;border-radius:14px;padding:13px 20px;font-weight:700;font-size:15px;width:100%}
.btn:active{transform:scale(.96)}
.err{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.4);color:#ff9b95;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:14px}
#app{display:flex;height:100dvh;display:none}
#app.active{display:flex}
#main{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);gap:14px}
.logout{position:fixed;bottom:20px;left:20px;right:20px;background:var(--red);color:#fff;padding:14px;border-radius:14px;font-weight:700}
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 46 46"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a29bfe"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient></defs><rect x="4" y="4" width="38" height="38" rx="12" fill="url(#lg)"/><path d="M14 30 L23 13 L32 30" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="24" r="2.4" fill="#fff"/></svg>
      <h1>Anox<span>Gram</span></h1>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="on" onclick="switchTab('login')">Вход</button>
      <button id="tabReg" onclick="switchTab('reg')">Регистрация</button>
    </div>
    <div id="authErr" class="err hidden"></div>
    <div class="field"><input id="aUser" placeholder="Ник (a-z, 0-9, _)" autocomplete="username"></div>
    <div class="field hidden" id="fNick"><input id="aNick" placeholder="Отображаемое имя"></div>
    <div class="field"><input id="aPass" type="password" placeholder="Пароль" autocomplete="current-password"></div>
    <button class="btn" id="authBtn" onclick="doAuth()">Войти</button>
    <div class="hint">Стартовый бонус: 1 000 Звёзд</div>
  </div>
</div>

<div id="app">
  <main id="main">
    <div style="font-size:64px">⭐</div>
    <div>Добро пожаловать, <b id="userName"></b>!</div>
    <div style="font-size:14px">Сайт и сервер связаны успешно.</div>
    <button class="logout" onclick="logout()">Выйти</button>
  </main>
</div>

<script>
const API = 'https://fame-api-1.onrender.com';
let TOKEN = localStorage.getItem('anox_token') || '';
let AUTH_MODE = 'login';

function switchTab(m){
  AUTH_MODE = m;
  document.getElementById('tabLogin').classList.toggle('on', m==='login');
  document.getElementById('tabReg').classList.toggle('on', m==='reg');
  document.getElementById('fNick').classList.toggle('hidden', m==='login');
  document.getElementById('authBtn').textContent = m==='login' ? 'Войти' : 'Создать аккаунт';
  document.getElementById('authErr').classList.add('hidden');
}

function showErr(t){
  const el = document.getElementById('authErr');
  el.textContent = t;
  el.classList.remove('hidden');
}

async function doAuth(){
  document.getElementById('authErr').classList.add('hidden');
  const user = document.getElementById('aUser').value.trim();
  const pass = document.getElementById('aPass').value;
  if(!user || !pass){ showErr('Введите ник и пароль'); return; }
  
  const btn = document.getElementById('authBtn');
  btn.textContent = 'Загрузка...';
  btn.disabled = true;

  try {
    const body = { username: user, password: pass };
    if(AUTH_MODE === 'reg') body.nickname = document.getElementById('aNick').value.trim() || user;
    
    const res = await fetch(API + '/api/' + (AUTH_MODE === 'login' ? 'login' : 'register'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    
    const data = await res.json();
    
    if(!res.ok){
      showErr(data.error || 'Ошибка сервера');
      btn.textContent = AUTH_MODE === 'login' ? 'Войти' : 'Создать аккаунт';
      btn.disabled = false;
      return;
    }
    
    TOKEN = data.token;
    localStorage.setItem('anox_token', TOKEN);
    enterApp(data.user);
  } catch(e) {
    showErr('Ошибка сети. Сервер на Render просыпается (подожди 30 сек и попробуй снова)');
    btn.textContent = AUTH_MODE === 'login' ? 'Войти' : 'Создать аккаунт';
    btn.disabled = false;
  }
}

function enterApp(user){
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = user ? user.nickname : 'друг';
}

async function checkAuth(){
  if(!TOKEN) return;
  try {
    const res = await fetch(API + '/api/me', { headers: { 'X-Token': TOKEN } });
    if(res.ok){
      const data = await res.json();
      enterApp(data.user);
    } else {
      TOKEN = ''; localStorage.removeItem('anox_token');
    }
  } catch(e) {}
}

function logout(){
  TOKEN = ''; localStorage.removeItem('anox_token');
  location.reload();
}

checkAuth();
</script>
</body>
</html>
