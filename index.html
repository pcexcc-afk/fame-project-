<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSINT</title>
    <style>
        /* Светлый, голубой, аккуратный фон */
        body {
            background-color: #e6f2ff; /* Нежно-голубой */
            color: #1a365d; /* Темно-синий текст */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        /* Верхнее меню из 4 кружочков */
        .top-nav {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .circle-btn {
            width: 65px;
            height: 65px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            color: #2b6cb0;
            box-shadow: 0 4px 10px rgba(43, 108, 176, 0.15);
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            line-height: 1.1;
            user-select: none;
        }

        .circle-btn:hover, .circle-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(43, 108, 176, 0.25);
            background-color: #f7fafc;
        }

        .circle-btn span {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* Строка поиска */
        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 40px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 30px;
            border: none;
            background-color: #ffffff;
            color: #1a365d;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 15px rgba(43, 108, 176, 0.1);
            box-sizing: border-box;
        }

        .search-box input::placeholder {
            color: #90cdf4;
        }

        .search-box .search-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            width: 45px;
            border-radius: 50%;
            border: none;
            background-color: #3182ce;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Главный заголовок OSINT */
        .main-title {
            text-align: center;
            font-size: 56px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #2b6cb0;
            text-shadow: 2px 2px 10px rgba(43, 108, 176, 0.2);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 4 Кружочка сверху -->
        <div class="top-nav">
            <div class="circle-btn" onclick="alert('Тут будет поиск')">
                <span>🔍</span>
                Поиск
            </div>
            <div class="circle-btn" onclick="alert('Тут будет Апилогер')">
                <span>📷</span>
                Апилогер
            </div>
            <div class="circle-btn" onclick="alert('Тут будет Фотолагер')">
                <span>🖼</span>
                Фотолагер
            </div>
            <div class="circle-btn" onclick="alert('Тут будет Фан Стат')">
                <span>📊</span>
                Фан Стат
            </div>
        </div>

        <!-- Строка поиска -->
        <div class="search-box">
            <input type="text" placeholder="Введите номер или ник...">
            <button class="search-btn">➔</button>
        </div>

        <!-- Название -->
        <div class="main-title">
            OSINT
        </div>
    </div>

</body>
</html>
