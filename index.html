<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pepegram</title>
<style>
:root{--blue:#2AABEE;--gold:#FFC53D;--green:#34C759;--red:#FF453A;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--txt:#f5f7fa;--dim:rgba(235,240,255,.55);--r:20px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background-color:#000;background-image:radial-gradient(120% 70% at 50% -10%,#12395b 0%,#07111c 45%,#000 80%),radial-gradient(60% 40% at 100% 100%,rgba(42,171,238,.12),transparent);background-attachment:fixed;color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden}
.hide{display:none!important}
.ic{width:22px;height:22px;flex:none}
.g{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
.scr{position:fixed;inset:0;margin:auto;max-width:480px;display:flex;flex-direction:column}
.over{z-index:20;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 8px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;flex:1}
.top h2{font-size:17px;font-weight:600;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--txt);cursor:pointer;font-weight:600;font-size:16px;font-family:inherit;border-color:var(--line)}
.main{flex:1;overflow-y:auto;padding:6px 16px 120px}
.tabs{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;padding:6px;border-radius:28px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:22px;color:var(--dim);font-weight:500;font-size:11px;font-family:inherit;background:none;border:0;cursor:pointer;transition:.2s}
.tab.on{color:var(--blue);background:rgba(42,171,238,.15)}
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);width:56px;height:56px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;cursor:pointer;background:linear-gradient(180deg,#3bb5f5,#1d8fd6);box-shadow:0 8px 24px rgba(42,171,238,.4);z-index:4}
.in{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:13px 14px;font:inherit;outline:0}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,171,238,.25)}
.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(180deg,#3bb5f5,#1d8fd6);cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(#3fd868,#25a244)}.btn.red{background:linear-gradient(#ff6a60,#d63a30)}
.btn.ghost{background:var(--glass);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px}.btn.wide{width:100%}
.dim{color:var(--dim)}
/* auth */
#auth{justify-content:center;padding:28px;gap:14px;text-align:center}
.logo{width:92px;height:92px;margin:0 auto 6px;border-radius:28px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,rgba(59,181,245,.9),rgba(29,143,214,.55))}
.logo svg{width:46px;height:46px}
#auth h1{font-size:36px;letter-spacing:-.03em}
.row{display:flex;gap:10px;align-items:center}
.codes{display:flex;gap:12px;justify-content:center;margin:6px 0}
.codes input{width:60px;height:68px;text-align:center;font-weight:600;font-size:28px;font-family:inherit;padding:0}
.err{color:var(--red);font-size:14px;min-height:20px}
/* lists */
.search{position:relative;margin-bottom:14px}
.search .ic{position:absolute;left:13px;top:13px;color:var(--dim);width:20px;height:20px}
.search .in{padding-left:42px;border-radius:16px}
.grp{overflow:hidden;margin-bottom:18px}
.it{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;transition:background .15s}
.it:active{background:rgba(255,255,255,.06)}
.it+.it{border-top:1px solid var(--line)}
.it .tx{flex:1;min-width:0}.it b{display:block;font-weight:600}
.it small{display:block;color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it time{color:var(--dim);font-size:12px;align-self:flex-start}
.cav{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.cav.a{background:linear-gradient(145deg,#3bb5f5,#1c6fb0)}.cav.b{background:linear-gradient(145deg,#ffcf5a,#c98a10)}
.lbl{color:var(--dim);font-size:13px;margin:0 6px 7px}
.sic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.sic .ic{width:19px;height:19px}.chev{color:var(--dim);width:18px;height:18px;margin-left:auto}
/* chat */
.msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;margin:4px 0;background:var(--glass);border:1px solid var(--line);word-break:break-word}
.msg.me{margin-left:auto;background:linear-gradient(#2fa7ec,#1d85c8);border-color:transparent}
.msg b{display:block;font-size:13px;color:var(--blue)}
.msg small{display:block;color:var(--dim);font-size:11px;text-align:right;margin-top:2px}.msg.me small{color:rgba(255,255,255,.75)}
.comp{display:flex;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.comp .btn{width:48px;padding:0;display:grid;place-items:center;border-radius:50%}
/* profile */
.av{padding:4px;border-radius:50%;background:var(--ring,transparent);width:112px;height:112px;margin:8px auto 12px}
.av i{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:44px;font-family:inherit;font-style:normal;color:#fff;background:linear-gradient(145deg,#1c4a70,#0a1a2a);border:3px solid #050b12}
.prof{text-align:center}.prof h3{font-size:24px}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 16px}
.bal div{padding:16px;text-align:center}.bal b{display:block;font-size:26px}
.sw{display:flex;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
.sw span{width:38px;height:38px;border-radius:50%;cursor:pointer;border:2px solid transparent;outline:1px solid var(--line);outline-offset:2px}
.sw span.on{border-color:#fff}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet>div{width:100%;max-width:480px;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);border-radius:28px 28px 0 0;background:rgba(18,26,36,.8)}
.sheet h3{margin-bottom:10px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-90px);z-index:99;padding:11px 18px;border-radius:30px;transition:.3s;font-size:14px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
/* admin */
.pl{margin-bottom:12px;overflow:hidden}
.pl summary{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.pl summary::-webkit-details-marker{display:none}
.pl .body{padding:4px 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line)}
.pl .body label{font-size:13px;color:var(--dim);display:block;margin:10px 0 5px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;border:1px solid}
.badge.r{color:var(--red)}.badge.y{color:var(--gold)}
.pl select{background:rgba(255,255,255,.06);color:var(--txt)}.pl option{color:#000}
.hold{font-size:12px;color:var(--dim);margin-top:5px}
.push{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;width:min(92vw,440px);transform:translate(-50%,-160px);z-index:100;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;cursor:pointer;transition:transform .45s cubic-bezier(.2,.9,.3,1.1);background:rgba(30,40,54,.72);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.push.on{transform:translate(-50%,0)}
.push b{display:block;font-size:14px}.push span{color:var(--dim);font-size:14px}
.sheet>div{max-height:90vh;overflow:auto}
.tgp{padding:6px 0 18px}.tgp .st{color:var(--blue);font-size:14px;margin-top:2px}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gift{padding:14px 6px 10px;border-radius:18px;text-align:center;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.25)}
.gift .ic{width:34px;height:34px}.gift b{font-size:12px}.gift small{font-size:11px;opacity:.85}
.seg{display:flex;padding:4px;gap:4px;margin-bottom:14px;border-radius:16px}
.seg button{flex:1;border:0;background:none;color:var(--dim);padding:9px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(42,171,238,.22);color:#fff}
.dial{width:210px;height:210px;display:block;margin:4px auto 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.chips .gift{min-width:98px;opacity:.5;cursor:pointer}.chips .gift.on{opacity:1;outline:2px solid #fff}
.cbal{text-align:center;margin-bottom:12px;color:var(--gold);font-weight:600}
.res{text-align:center;min-height:24px;margin:8px 0;font-weight:600}
.pr{position:relative;padding:11px 14px;display:flex;justify-content:space-between;overflow:hidden;border-top:1px solid var(--line)}
.pr i{position:absolute;left:0;top:0;bottom:0;background:rgba(42,171,238,.22)}.pr span{position:relative}
.pr.hl{background:rgba(255,255,255,.14)}.pr.win{background:rgba(52,199,89,.38)}
#admin{max-width:760px}
.gift{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.35);cursor:pointer}
.gift .ic{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.gift small{background:rgba(0,0,0,.28);padding:2px 9px;border-radius:12px;opacity:1}
.gift b{line-height:1.15;min-height:28px;display:flex;align-items:center}
.gw{position:relative;display:grid;place-items:center;width:64px;height:64px}
.gw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.reel{position:relative;overflow:hidden;border-radius:18px;margin:6px 0 12px;padding:10px 0;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.reel::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 12px #fff;border-radius:2px}
.strip{display:flex;gap:10px;will-change:transform}
.rt{flex:none;width:110px;padding:10px 4px 8px;border-radius:16px;text-align:center;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.art{width:64px;height:64px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- РЕГИСТРАЦИЯ -->
<section id="auth" class="scr">
  <div class="logo g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M21 4L3 11l6 2.5L11.5 20l2.7-4.8L19 18z"/><path d="M9 13.5L21 4"/></svg></div>
  <h1>Pepegram</h1>
  <p class="dim">Войдите по номеру телефона</p>
  <div id="step1" style="display:grid;gap:12px;margin-top:10px">
    <div class="row"><input id="phone" class="in" type="tel" inputmode="tel" placeholder="+1 202 555 0123" autocomplete="tel"><button class="g ib" id="dice" title="Случайный тестовый номер" data-ic="dice" style="flex:none"></button></div>
    <button class="btn" id="getCode">Получить код</button>
    <div class="err" id="e1"></div>
  </div>
  <div id="step2" class="hide" style="display:grid;gap:12px;margin-top:10px">
    <p class="dim">Код отправлен на <span id="phoneShow"></span></p>
    <div class="codes"><input class="in" maxlength="1" inputmode="numeric"><input class="in" maxlength="1" inputmode="numeric"><input class="in" maxlength="1" inputmode="numeric"><input class="in" maxlength="1" inputmode="numeric"></div>
    <div class="err" id="e2"></div>
    <button class="btn ghost" id="back1">Изменить номер</button>
  </div>
</section>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<section id="app" class="scr hide">
  <div class="top"><h1 id="title">Чаты</h1><button id="adminBtn" class="g ib hide" title="Админ-панель">A</button></div>
  <div class="main">
    <div id="v-chats">
      <div class="search"><span data-ic="search"></span><input id="q" class="in" placeholder="Поиск"></div>
      <div id="chatList" class="g grp"></div>
    </div>
    <div id="v-contacts" class="hide"></div>
    <div id="v-casino" class="hide"></div>
    <div id="v-settings" class="hide"></div>
    <div id="v-profile" class="hide"></div>
  </div>
  <button class="fab" id="fab" data-ic="pencil" title="Создать"></button>
  <nav class="tabs g">
    <button class="tab on" data-tab="chats" data-ic="chat"><span>Чаты</span></button>
    <button class="tab" data-tab="contacts" data-ic="user"><span>Контакты</span></button>
    <button class="tab" data-tab="settings" data-ic="gear"><span>Настройки</span></button>
    <button class="tab" data-tab="casino" data-ic="dice"><span>Казино</span></button>
  </nav>
</section>

<!-- ПЕРЕПИСКА -->
<section id="chat" class="scr over hide">
  <div class="top"><button class="g ib" id="chatBack" data-ic="back"></button><h2 id="chatTitle"></h2></div>
  <div class="msgs" id="msgs"></div>
  <div class="comp"><input id="msgIn" class="in" placeholder="Сообщение" autocomplete="off"><button class="btn" id="send" data-ic="send"></button></div>
</section>

<!-- АДМИН-ПАНЕЛЬ -->
<section id="admin" class="scr over hide">
  <div class="top"><button class="g ib" id="adminBack" data-ic="back"></button><h2>Админ-панель</h2></div>
  <div class="main"><div id="adminTop"></div><input id="adminQ" class="in" placeholder="Поиск игрока: имя или ID" style="margin-bottom:12px"><div id="adminList"></div></div>
</section>

<div id="sheet" class="sheet hide"><div class="g" id="sheetBox"></div></div>
<div id="toast" class="toast g"></div>
<div id="push" class="push g"></div>

<script>
/* ============ КОНФИГ ============ */
const ADMIN_ID = 1780245651;
const START_STARS = 1000;

/* ============ API-ЗАГЛУШКИ: замените тела функций на fetch() к вашему Python-серверу ============ */
const API = {
  async sendCode(phone){ API._c = String(1000 + Math.floor(Math.random()*9000)); setTimeout(() => push('Pepegram', 'Ваш код подтверждения: ' + API._c), 1200); return {ok:true}; },
  async verifyCode(phone, code){
    return {ok: code === API._c, user:{id: phone.replace(/\D/g,'') === OWNER_PHONE ? ADMIN_ID : Math.floor(1e9 + Math.random()*9e9), phone, name:'Пользователь', stars:START_STARS, grams:0, nickColor:'#f5f7fa', frame:'transparent'}};
  },
  async sendMessage(chatId, text){ return {ok:true}; },
  async saveProfile(profile){ return {ok:true}; },
  async upgrade(p){ const g = GIFTS.find(x => x.id === p.giftId), ch = p.mode === 'x2' ? 47.5 : Math.min(95, p.bet / g.v * 95), roll = Math.random()*100; return {roll, win: roll < ch}; },
  async pvpBet(amount){ return {ok:true}; },
  async pvpDraw(bets){ const e = Object.entries(bets), t = e.reduce((s, x) => s + x[1], 0); let r = Math.random()*t; for(const [n, b] of e){ if((r -= b) < 0) return n; } return e[0][0]; },
  async getPlayers(){ return PLAYERS; },
  async adminAction(type, playerId, payload){ return {ok:true}; }
};

/* ============ ДАННЫЕ ============ */
const S = {user:null, tab:'chats', chat:null};
const CHATS = [
  {id:'chat', name:'Pepegram Chat', sub:'Общий чат', ic:'chat', cls:'a', msgs:[{from:'Pepegram', t:'Добро пожаловать в общий чат!', time:'12:00'}]},
  {id:'channel', name:'Pepegram Channel', sub:'Канал', ic:'mega', cls:'b', readonly:true, msgs:[{from:'Pepegram', t:'Здесь публикуются новости проекта.', time:'12:00'}]}
];
let PLAYERS = [
  {id:ADMIN_ID, name:'Владелец', phone:'+7 000 000-00-00', stars:5000, frozen:false, admin:null, gifts:['Плюш Пепе'], names:[], nums:[]},
  {id:2048117350, name:'Алекс', stars:1000, frozen:false, admin:null, gifts:['Сердце с бантом'], names:[], nums:[]},
  {id:3391820045, name:'Мария', stars:250, frozen:true, admin:null, gifts:[], names:['@maria'], nums:[]},
  {id:4172006618, name:'Дмитрий', stars:0, frozen:false, admin:'Обычная', gifts:[], names:[], nums:['+888 0123 4567']}
];
const COLORS = ['#f5f7fa','#2AABEE','#FFC53D','#34C759','#FF453A','#BF5AF2'];
const FRAMES = ['transparent','#2AABEE','#FFC53D','#34C759','#FF453A','conic-gradient(#2AABEE,#FFC53D,#FF453A,#34C759,#2AABEE)'];

/* ============ ИКОНКИ ============ */
const ICONS = {
  bear:'<circle cx="7" cy="6" r="2.500"/><circle cx="17" cy="6" r="2.500"/><circle cx="12" cy="13" r="7"/><circle cx="12" cy="15" r="2"/>',
  rose:'<path d="M12 3c-3 0-5 2-5 5s2 5 5 5 5-2 5-5-2-5-5-5z"/><path d="M12 13v8M12 17c-3 0-4-2-4-3M12 18c2 0 4-1 4-3"/>',
  cake:'<path d="M4 20h16v-7H4z"/><path d="M4 16c3 2 5-2 8 0s5-2 8 0M9 13V9M15 13V9"/>',
  rocket:'<path d="M12 3c4 2 6 6 5 11l-3 3h-4l-3-3c-1-5 1-9 5-11z"/><circle cx="12" cy="10" r="1.500"/><path d="M7 14l-3 3 3 1M17 14l3 3-3 1M10 21l2-2 2 2"/>',
  cup:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/>',
  heart:'<path d="M12 20s-8-5-8-11a4.500 4.500 0 0 1 8-2.500A4.500 4.500 0 0 1 20 9c0 6-8 11-8 11z"/>',
  bottle:'<path d="M10 3h4v4l2 3v10H8V10l2-3z"/><path d="M8 14h8"/>',
  skull:'<path d="M5 12a7 7 0 0 1 14 0v3h-2v3H7v-3H5z"/><circle cx="9.500" cy="12" r="1.500"/><circle cx="14.500" cy="12" r="1.500"/>',
  cat:'<path d="M5 20V8l3 2h8l3-2v12z"/><circle cx="9.500" cy="14" r="1"/><circle cx="14.500" cy="14" r="1"/>',
  pop:'<circle cx="10" cy="10" r="6"/><path d="M14 14l6 6M10 4a6 6 0 0 1 6 6"/>',
  book:'<path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/>',
  pepe:'<circle cx="8" cy="7.5" r="3.2"/><circle cx="16" cy="7.5" r="3.2"/><path d="M3 14c0-3 2-5 4-5h10c2 0 4 2 4 5 0 4-4 7-9 7s-9-3-9-7z"/><path d="M7.5 16.5c3 1.7 6 1.7 9 0"/><circle cx="8" cy="7.5" r=".7" fill="currentColor"/><circle cx="16" cy="7.5" r=".7" fill="currentColor"/>',
  cap:'<path d="M4 15a8 8 0 0 1 16 0z"/><path d="M20 15c2 0 3 .6 3 2H11"/><path d="M12 7v8"/>',
  locket:'<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 11c0 5.600-7 10-7 10z"/><path d="M8 3l4 4 4-4"/>',
  ring:'<circle cx="12" cy="15" r="6"/><path d="M9 4h6l2 3-5 3-5-3z"/>',
  bag:'<path d="M8 3h8l-2 4h-4z"/><path d="M10 7C5 10 4 14 4 17a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4c0-3-1-7-6-10"/><path d="M12 12v5M10 14h4"/>',
  watch:'<rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 9v3l2 1"/>',

$('#adminList').onclick = async e => {

  const row = b.closest('.row'), inp = row && row.querySelector('input'), sel = row && row.querySelector('select'), v = inp ? inp.value.trim() : '';

}
$('#v-casino').onclick = e => {
  const m = e.target.closest('[data-m]'), u = e.target.closest('[data-u]'), g = e.target.closest('[data-g]');
  if(m){ $$('[data-m]').forEach(b => b.classList.toggle('on', b === m)); $('#c-up').classList.toggle('hide', m.dataset.m !== 'up'); $('#c-pvp').classList.toggle('hide', m.dataset.m !== 'pvp'); }
  else if(u){ up.mode = u.dataset.u; $$('[data-u]').forEach(b => b.classList.toggle('on', b === u)); $('#upG').classList.toggle('hide', up.mode !== 'nft'); updUp(); }
  else if(g){ up.gift = g.dataset.g; $$('[data-g]').forEach(b => b.classList.toggle('on', b === g)); updUp(); }
  else if(e.target.id === 'upMax'){ $('#upBet').value = S.user.stars; updUp(); }
  else if(e.target.id === 'upGo') doUpgrade();
  else if(e.target.id === 'pvpGo') pvpBet();
};
$('#v-casino').oninput = e => { if(e.target.id === 'upBet') updUp(); };
function upCalc(){
  const bet = Math.floor(+$('#upBet').value) || 0; let tgt, ch;
  if(up.mode === 'x2'){ tgt = bet*2; ch = 47.5; } else { tgt = GIFTS.find(g => g.id === up.gift).v; ch = Math.min(95, bet/tgt*95); }
  return {bet, tgt, ch: Math.round(ch*10)/10};
}
function updUp(){
  const c = upCalc();
  $('#arc').setAttribute('stroke-dasharray', `${c.ch/100*502.65} 502.65`); $('#dTxt').textContent = c.ch + '%';
  $('#upInfo').textContent = up.mode === 'x2' ? `Выигрыш: ${c.tgt} ⭐` : `Цель: ${c.tgt} ⭐ · шанс ${c.ch}%`;
}
async function doUpgrade(){
  if(up.busy || blocked()) return;
  const c = upCalc();
  if(c.bet < 1 || c.bet > S.user.stars) return toast('Проверьте ставку');
  if(c.ch < 0.1) return toast('Шанс меньше 0.1% — увеличьте ставку');
  up.busy = true; S.user.stars -= c.bet; refreshBal(); $('#upRes').textContent = '';
  const r = await API.upgrade({mode:up.mode, bet:c.bet, giftId:up.gift}), p = $('#ptr');
  p.style.transition = 'none'; p.style.transform = 'rotate(0deg)'; p.getBoundingClientRect();
  p.style.transition = 'transform 3.5s cubic-bezier(.1,.7,.1,1)'; p.style.transform = `rotate(${1800 + r.roll*3.6}deg)`;
  setTimeout(() => {
    const el = $('#upRes'); up.busy = false;
    if(r.win){
      if(up.mode === 'x2'){ S.user.stars += c.bet*2; el.textContent = `Победа! +${c.bet*2} ⭐`; }
      else { const g = GIFTS.find(x => x.id === up.gift); S.user.gifts.push({id:g.id, up:null}); el.textContent = `Победа! Получен подарок «${g.n}»`; }
      el.style.color = 'var(--green)';
    } else { el.textContent = 'Не повезло, попробуйте ещё'; el.style.color = 'var(--red)'; }
    refreshBal();
  }, 3600);
}
/* PvP */
function pvpNew(){ clearInterval(pvp.timer); Object.assign(pvp, {bets:{}, t:20, busy:false, fin:false, hl:null}); renderPvp(); pvp.timer = setInterval(pvpTick, 1000); }
function pvpTick(){
  if(pvp.busy) return;
  if(--pvp.t <= 0) return pvpEnd();
  if(Math.random() < .55){ const b = BOTS[Math.floor(Math.random()*BOTS.length)]; pvp.bets[b] = (pvp.bets[b] || 0) + Math.ceil(Math.random()*8)*50; }
  renderPvp();
}
function renderPvp(){
  if(!$('#pvpList')) return;
  const e = Object.entries(pvp.bets).sort((a, b) => b[1] - a[1]), tot = e.reduce((s, x) => s + x[1], 0);
  $('#pvpPot').textContent = `Банк: ${tot} ⭐`;
  $('#pvpT').textContent = pvp.busy ? 'Определяем победителя…' : `До розыгрыша: ${pvp.t} с`;
  $('#pvpList').innerHTML = e.length ? e.map(([n, b]) => `<div class="pr ${pvp.hl === n ? (pvp.fin ? 'win' : 'hl') : ''}"><i style="width:${b/tot*100}%"></i><span>${n === 'me' ? 'Вы' : esc(n)}</span><span>${b} ⭐ · ${(b/tot*100).toFixed(1)}%</span></div>`).join('') : '<div class="it dim" style="border-top:1px solid var(--line);cursor:default">Ставок пока нет</div>';
}
async function pvpBet(){
  if(blocked()) return;
  if(pvp.busy) return toast('Идёт розыгрыш');
  const a = Math.floor(+$('#pvpBet').value);
  if(a < 1 || a > S.user.stars) return toast('Проверьте ставку');
  S.user.stars -= a; pvp.bets.me = (pvp.bets.me || 0) + a; $('#pvpBet').value = '';
  await API.pvpBet(a); refreshBal(); renderPvp();
}
async function pvpEnd(){
  pvp.busy = true; clearInterval(pvp.timer);
  const e = Object.entries(pvp.bets), tot = e.reduce((s, x) => s + x[1], 0);
  if(e.length < 2){ if(pvp.bets.me){ S.user.stars += pvp.bets.me; refreshBal(); toast('Нет соперников — ставка возвращена'); } return setTimeout(pvpNew, 1500); }
  const w = await API.pvpDraw(pvp.bets), names = e.map(x => x[0]); let i = 0;
  const iv = setInterval(() => { pvp.hl = names[i++ % names.length]; renderPvp(); }, 110);
  setTimeout(() => {
    clearInterval(iv); pvp.hl = w; pvp.fin = true; renderPvp();
    const pay = Math.floor(tot*.95);
    if(w === 'me'){ S.user.stars += pay; refreshBal(); toast(`Вы выиграли ${pay} ⭐`); } else toast(`Победил ${w}`);
    setTimeout(pvpNew, 4000);
  }, 2600);
}

/* ============ ОБЩЕЕ ============ */
function renderAll(){
  renderChats(); renderSettings(); renderContacts(); renderProfile(); renderCasino();
  $('#adminBtn').classList.toggle('hide', !isAdmin());
}

window.Pepegram = {
  API, receiveMessage,
  setBalance(stars, grams){ S.user.stars = stars; if(grams != null) S.user.grams = grams; renderProfile(); },
  loginAs(id){ S.user.id = id; renderAll(); }
};
restore();
</script>
