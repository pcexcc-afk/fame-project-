<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxonAI — открытый искусственный интеллект</title>
<style>
:root, [data-theme="dark"] {
  --bg:#070b14; --bg2:#0d1424; --card:#111a30; --text:#e6ecff; --muted:#8b98b8;
  --accent:#6d8bff; --accent2:#9b6dff; --border:#1e2a4a; --bubble-u:#1c2a52; --bubble-a:#141d36;
}
[data-theme="light"] {
  --bg:#f4f7ff; --bg2:#ffffff; --card:#ffffff; --text:#17203a; --muted:#5a6a90;
  --accent:#3b5bdb; --accent2:#7048e8; --border:#dbe3f5; --bubble-u:#dbe4ff; --bubble-a:#ffffff;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
#stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
header { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border); }
.logo { font-size:20px; font-weight:800; background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent; }
#themeBtn { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--card);
  color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.3s; }
#themeBtn:hover { transform:rotate(30deg) scale(1.1); border-color:var(--accent); }
main { position:relative; z-index:1; flex:1; padding:16px; padding-bottom:90px; max-width:820px; width:100%; margin:0 auto; }
.tab { display:none; height:calc(100vh - 180px); flex-direction:column; }
.tab.active { display:flex; }
#chatBox { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:85%; padding:12px 16px; border-radius:18px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.msg.user { align-self:flex-end; background:var(--bubble-u); border-bottom-right-radius:4px; }
.msg.ai { align-self:flex-start; background:var(--bubble-a); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg code { display:block; background:#0a0f1e; color:#9fe8a0; padding:12px; border-radius:10px; margin:8px 0;
  overflow-x:auto; font-family:Consolas,monospace; font-size:13px; }
.msg p code { display:inline; padding:2px 6px; margin:0; }
.msg pre code { margin:0; }
.typing { align-self:flex-start; color:var(--muted); font-style:italic; padding:6px 12px; }
#inputBar { display:flex; gap:8px; padding:10px 0; }
#msgInput { flex:1; padding:14px 18px; border-radius:26px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:15px; outline:none; }
#msgInput:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.iconbtn { width:50px; height:50px; border-radius:50%; border:1px solid var(--border); background:var(--card);
  color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; flex-shrink:0; }
.iconbtn:hover { border-color:var(--accent); transform:scale(1.08); }
#sendBtn { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; }
#sendBtn:hover { filter:brightness(1.15); }
#micBtn.rec { background:#e03131; color:#fff; border:none; animation:pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(224,49,49,.25); } }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; }
#imgRow { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:14px; overflow-y:auto; flex:1; }
#imgRow img { width:100%; border-radius:12px; border:1px solid var(--border); }
#imgRow .ph { aspect-ratio:1; border-radius:12px; background:linear-gradient(110deg,var(--card) 30%,var(--bg2) 50%,var(--card) 70%);
  background-size:200% 100%; animation:shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position:-200% 0; } }
nav { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; justify-content:center; gap:8px;
  padding:10px; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(10px);
  border-top:1px solid var(--border); }
nav button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 22px; border:none;
  background:transparent; color:var(--muted); cursor:pointer; border-radius:14px; font-size:12px; transition:.25s; }
nav button.active { color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
nav button:hover { color:var(--text); }
.setting-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
input[type=text] { padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg2);
  color:var(--text); width:100%; outline:none; }
.small { color:var(--muted); font-size:13px; margin-top:6px; }
h2 { margin-bottom:12px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header>
  <div class="logo">◈ AxonAI</div>
  <button id="themeBtn" title="Сменить тему">
    <svg id="iconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="iconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <!-- ЧАТ -->
  <section id="tab-chat" class="tab active">
    <div id="chatBox"></div>
    <div id="inputBar">
      <button class="iconbtn" id="micBtn" title="Голосовой ввод">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
      </button>
      <input id="msgInput" placeholder="Спроси AxonAI о чём угодно..." autocomplete="off">
      <button class="iconbtn" id="sendBtn" title="Отправить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </section>

  <!-- КАРТИНКИ -->
  <section id="tab-img" class="tab">
    <div class="card">
      <h2>Генерация картинок</h2>
      <div style="display:flex;gap:8px">
        <input type="text" id="imgPrompt" placeholder="Опиши картинку: «космический кот в неоновом городе»">
        <button class="iconbtn" id="genBtn" style="background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
      </div>
    </div>
    <div id="imgRow"></div>
  </section>

  <!-- НАСТРОЙКИ -->
  <section id="tab-set" class="tab">
    <div class="card">
      <h2>Настройки</h2>
      <div class="setting-row">
        <div>Адрес сервера API<div class="small">Оставь пустым, если index.html лежит рядом с app.py</div></div>
        <input type="text" id="apiUrl" placeholder="https://axonai.onrender.com" style="max-width:260px">
      </div>
      <div class="setting-row">
        <div>Очистить историю чата</div>
        <button class="iconbtn" id="clearBtn" title="Очистить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </div>
      <div class="setting-row" style="border:none">
        <div>Тема оформления</div>
        <button class="iconbtn" id="themeBtn2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <p class="small">AxonAI — открытый проект. Без регистрации, без лимитов. Отвечает на русском, пишет код, генерирует изображения.</p>
    </div>
  </section>
</main>

<nav>
  <button class="active" data-tab="chat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    Чаты</button>
  <button data-tab="img">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    Картинки</button>
  <button data-tab="set">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Настройки</button>
</nav>

<script>
// ---------- ЗВЁЗДЫ ----------
const cv = document.getElementById('stars'), cx = cv.getContext('2d');
let stars = [], meteors = [];
function resize(){ cv.width = innerWidth; cv.height = innerHeight;
  stars = Array.from({length:160}, () => ({x:Math.random()*cv.width, y:Math.random()*cv.height, r:Math.random()*1.4+.3, tw:Math.random()*6.28})); }
addEventListener('resize', resize); resize();
function spawnMeteor(){ meteors.push({x:Math.random()*cv.width*.8+cv.width*.2, y:-20, vx:-(3+Math.random()*4), vy:3+Math.random()*4, life:1});
  setTimeout(spawnMeteor, 2000+Math.random()*4000); }
spawnMeteor();
function draw(){
  const dark = document.documentElement.dataset.theme === 'dark';
  cx.clearRect(0,0,cv.width,cv.height);
  if (dark) {
    stars.forEach(s => { s.tw += .05; cx.globalAlpha = .4 + Math.sin(s.tw)*.35;
      cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill(); });
    cx.globalAlpha = 1;
    meteors = meteors.filter(m => m.life > 0);
    meteors.forEach(m => { m.x += m.vx; m.y += m.vy; m.life -= .012;
      const g = cx.createLinearGradient(m.x, m.y, m.x - m.vx*12, m.y - m.vy*12);
      g.addColorStop(0, `rgba(180,200,255,${m.life})`); g.addColorStop(1, 'rgba(180,200,255,0)');
      cx.strokeStyle = g; cx.lineWidth = 2; cx.beginPath();
      cx.moveTo(m.x, m.y); cx.lineTo(m.x - m.vx*12, m.y - m.vy*12); cx.stroke(); });
  }
  requestAnimationFrame(draw);
}
draw();

// ---------- ТЕМА ----------
const htmlEl = document.documentElement;
function setTheme(t){ htmlEl.dataset.theme = t;
  document.getElementById('iconMoon').style.display = t === 'dark' ? '' : 'none';
  document.getElementById('iconSun').style.display = t === 'dark' ? 'none' : '';
  localStorage.setItem('axon_theme', t); }
document.getElementById('themeBtn').onclick = () => setTheme(htmlEl.dataset.theme === 'dark' ? 'light' : 'dark');
document.getElementById('themeBtn2').onclick = document.getElementById('themeBtn').onclick;
setTheme(localStorage.getItem('axon_theme') || 'dark');

// ---------- ВКЛАДКИ ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('tab-' + b.dataset.tab).classList.add('active');
});

// ---------- API ----------
const apiUrlInput = document.getElementById('apiUrl');
apiUrlInput.value = localStorage.getItem('axon_api') || '';
apiUrlInput.onchange = () => localStorage.setItem('axon_api', apiUrlInput.value.trim());
const api = () => (apiUrlInput.value || location.origin).replace(/\/$/, '');

// ---------- ЧАТ ----------
const chatBox = document.getElementById('chatBox');
const input = document.getElementById('msgInput');
function md(t){ // мини-разметка: **жирный**, `код`, ```блок```
  let s = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```([\s\S]*?)```/g, (_,c) => '<code>'+c.trim()+'</code>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s.replace(/\n/g,'<br>'); }
function addMsg(text, who){ const d = document.createElement('div');
  d.className = 'msg ' + who; d.innerHTML = md(text);
  chatBox.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight; return d; }
addMsg('Привет! Я AxonAI — открытый ИИ без регистрации. Могу написать код, объяснить любую тему или сгенерировать картинку. Чем помочь?', 'ai');

async function send(){
  const text = input.value.trim(); if (!text) return;
  input.value = ''; addMsg(text, 'user');
  const t = document.createElement('div'); t.className = 'typing'; t.textContent = 'AxonAI думает...';
  chatBox.appendChild(t); chatBox.scrollTop = chatBox.scrollHeight;
  try {
    const r = await fetch(api() + '/api/chat', { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: text}) });
    const j = await r.json();
    t.remove(); addMsg(j.reply || 'Ошибка: пустой ответ сервера.', 'ai');
  } catch(e) { t.remove(); addMsg('Не удалось связаться с сервером. Проверь адрес API в Настройках (сейчас: ' + api() + ').', 'ai'); }
}
document.getElementById('sendBtn').onclick = send;
input.onkeydown = e => { if (e.key === 'Enter') send(); };

document.getElementById('clearBtn').onclick = async () => {
  try { await fetch(api() + '/api/clear', {method:'POST'}); chatBox.innerHTML = '';
    addMsg('История очищена. Начнём с чистого листа!', 'ai'); } catch(e) {} };

// ---------- ГОЛОСОВОЙ ВВОД ----------
const mic = document.getElementById('micBtn');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) mic.style.display = 'none';
else {
  const rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = false;
  mic.onclick = () => { mic.classList.add('rec'); rec.start(); };
  rec.onresult = e => { input.value = e.results[0][0].transcript; send(); };
  rec.onend = () => mic.classList.remove('rec');
  rec.onerror = () => mic.classList.remove('rec');
}

// ---------- КАРТИНКИ ----------
const imgRow = document.getElementById('imgRow');
document.getElementById('genBtn').onclick = async () => {
  const p = document.getElementById('imgPrompt').value.trim(); if (!p) return;
  const ph = document.createElement('div'); ph.className = 'ph'; imgRow.prepend(ph);
  try {
    const r = await fetch(api() + '/api/image?prompt=' + encodeURIComponent(p));
    const j = await r.json();
    const img = document.createElement('img'); img.src = j.url; img.alt = p;
    ph.replaceWith(img);
  } catch(e) { ph.remove(); }
};
document.getElementById('imgPrompt').onkeydown = e => { if (e.key === 'Enter') document.getElementById('genBtn').click(); };
</script>
</body>
</html>
