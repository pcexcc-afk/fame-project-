<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CrushGram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #ffffff; --accent: #0a84ff; --danger: #ff453a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    
    .container { width: 100%; max-width: 400px; padding: 20px; }
    .logo { text-align: center; font-size: 32px; font-weight: 800; margin-bottom: 30px; background: linear-gradient(90deg, #0a84ff, #bf5af2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .card { background: var(--card); padding: 30px 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    
    .step { display: none; flex-direction: column; gap: 15px; }
    .step.active { display: flex; }
    
    h2 { font-size: 20px; text-align: center; margin-bottom: 10px; }
    p { font-size: 14px; color: #888; text-align: center; margin-bottom: 10px; }
    
    input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; }
    input:focus { border-color: var(--accent); }
    
    button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #555; cursor: not-allowed; }
    
    .error { color: var(--danger); font-size: 13px; text-align: center; }
    .success { color: #34c759; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">CrushGram</div>
    
    <div class="card">
        <!-- ШАГ 1: Ввод номера -->
        <div id="step-phone" class="step active">
            <h2>Вход</h2>
            <p>Введите ваш номер или ID</p>
            <input type="text" id="phoneInput" placeholder="+7 999 123-45-67">
            <button onclick="requestCode()">Получить код</button>
            <div id="error-phone" class="error"></div>
        </div>

        <!-- ШАГ 2: Ввод кода -->
        <div id="step-code" class="step">
            <h2>Введите код</h2>
            <p>Код отправлен на ваш номер (имитация)</p>
            <input type="text" id="codeInput" placeholder="1234">
            <button onclick="verifyCode()">Подтвердить</button>
            <div id="error-code" class="error"></div>
        </div>

        <!-- ШАГ 3: Создание пароля -->
        <div id="step-create-pw" class="step">
            <h2>Создайте пароль</h2>
            <p>Придумайте пароль для входа</p>
            <input type="password" id="newPasswordInput" placeholder="Пароль">
            <button onclick="createPassword()">Сохранить пароль</button>
            <div id="error-create-pw" class="error"></div>
        </div>

        <!-- ШАГ 4: Ввод пароля -->
        <div id="step-login-pw" class="step">
            <h2>Введите пароль</h2>
            <p>Введите пароль от вашего аккаунта</p>
            <input type="password" id="loginPasswordInput" placeholder="Пароль">
            <button onclick="loginWithPassword()">Войти</button>
            <div id="error-login-pw" class="error"></div>
        </div>

        <!-- ШАГ 5: Успех -->
        <div id="step-success" class="step">
            <h2>Успешный вход!</h2>
            <p>Добро пожаловать в CrushGram</p>
            <button onclick="location.reload()">Выйти</button>
        </div>
    </div>
</div>

<script>
    const API = "https://fame-api-bs11.onrender.com"; 
    let currentPhone = "";

    function showStep(stepId) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step-' + stepId).classList.add('active');
    }

    async function requestCode() {
        const phone = document.getElementById('phoneInput').value.trim();
        if (!phone) return document.getElementById('error-phone').innerText = "Введите номер";
        
        currentPhone = phone;
        document.getElementById('error-phone').innerText = "";
        
        try {
            const res = await fetch(API + '/api/auth/request_code', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: phone})
            });
            const data = await res.json();
            
            if (data.success) {
                showStep('code');
                alert("Тестовый код: " + data.test_code); // Временно
            } else {
                document.getElementById('error-phone').innerText = data.error;
            }
        } catch(e) { document.getElementById('error-phone').innerText = "Ошибка сети"; }
    }

    async function verifyCode() {
        const code = document.getElementById('codeInput').value.trim();
        if (!code) return document.getElementById('error-code').innerText = "Введите код";
        
        try {
            const res = await fetch(API + '/api/auth/verify_code', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: currentPhone, code: code})
            });
            const data = await res.json();
            
            if (data.success) {
                if (data.require_password) {
                    showStep('login-pw');
                } else {
                    showStep('create-pw');
                }
            } else {
                document.getElementById('error-code').innerText = data.error;
            }
        } catch(e) { document.getElementById('error-code').innerText = "Ошибка сети"; }
    }

    async function createPassword() {
        const pw = document.getElementById('newPasswordInput').value.trim();
        if (pw.length < 4) return document.getElementById('error-create-pw').innerText = "Минимум 4 символа";
        
        try {
            const res = await fetch(API + '/api/auth/create_password', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: currentPhone, password: pw})
            });
            const data = await res.json();
            
            if (data.success) {
                showStep('success');
            } else {
                document.getElementById('error-create-pw').innerText = data.error;
            }
        } catch(e) { document.getElementById('error-create-pw').innerText = "Ошибка сети"; }
    }

    async function loginWithPassword() {
        const pw = document.getElementById('loginPasswordInput').value.trim();
        if (!pw) return document.getElementById('error-login-pw').innerText = "Введите пароль";
        
        try {
            const res = await fetch(API + '/api/auth/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: currentPhone, password: pw})
            });
            const data = await res.json();
            
            if (data.success) {
                showStep('success');
            } else {
                document.getElementById('error-login-pw').innerText = data.error;
            }
        } catch(e) { document.getElementById('error-login-pw').innerText = "Ошибка сети"; }
    }
</script>
</body>
</html>
