<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fame Checker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #050505;
            --card: #141414;
            --text: #ffffff;
            --accent: #ff2a2a;
            --border: #222222;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            /* Фоновое изображение сакуры, если анимация не сработает */
            background-image: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Затемнение фона, чтобы текст читался */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        #sakura-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container { width: 100%; max-width: 400px; margin: 0 auto; position: relative; z-index: 1; }
        
        .menu-btn {
            position: absolute;
            top: 0; right: 0;
            width: 40px; height: 40px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        .menu-btn div { width: 20px; height: 2px; background: var(--text); margin: 3px 0; }

        .side-menu {
            position: fixed;
            top: 0; right: -250px;
            width: 250px; height: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-left: 1px solid var(--border);
            padding: 20px;
            transition: 0.3s;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .side-menu.open { right: 0; }
        .side-menu .btn { margin-bottom: 0; }
        .close-btn { align-self: flex-end; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; margin-bottom: 10px; }

        h1 { font-size: 20px; font-weight: 600; margin-bottom: 5px; text-align: left; }
        p.subtitle { color: #aaa; font-size: 13px; margin-bottom: 30px; text-align: left; }
        
        .input-group { margin-bottom: 20px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: rgba(20, 20, 20, 0.8);
            color: white;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(5px);
            margin-bottom: 10px;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: var(--accent); }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: rgba(20, 20, 20, 0.8);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .btn:hover { border-color: var(--accent); }
        .btn-main { background-color: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }

        .result-card {
            margin-top: 20px; padding: 20px;
            border-radius: 8px; background: rgba(20, 20, 20, 0.9);
            display: none; border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            backdrop-filter: blur(5px);
        }
        
        .badges { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: rgba(20, 20, 20, 0.8); cursor: pointer; backdrop-filter: blur(5px); }
        .badge-fame { color: #fff; border-color: #fff; }
        .badge-fake { color: var(--accent); border-color: var(--accent); }
        .badge-scam { color: var(--accent); border-color: var(--accent); }

        .people-list { margin-top: 20px; display: none; }
        .person { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(20, 20, 20, 0.8); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; backdrop-filter: blur(5px); }
        .person-name { font-weight: 600; }
        .person-status { font-size: 12px; padding: 4px 8px; border-radius: 4px; }
        .status-fame { color: #fff; border: 1px solid #fff; }
        .status-fake { color: var(--accent); border: 1px solid var(--accent); }
        .status-scam { color: var(--accent); border: 1px solid var(--accent); }

        .admin-panel {
            margin-top: 30px; padding: 20px;
            border-radius: 8px; background: rgba(20, 20, 20, 0.9);
            border: 1px solid var(--border); display: none;
            backdrop-filter: blur(5px);
        }
        .admin-panel h2 { font-size: 15px; margin-top: 0; margin-bottom: 15px; font-weight: 600; color: #aaa; }
        .admin-btn { display: block; width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); color: #ccc; border-radius: 6px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
        
        .secret-login { margin-top: 50px; text-align: center; opacity: 0.2; transition: 0.3s; }
        .secret-login:hover { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="sakura-canvas"></canvas>

    <div class="container">
        <div class="menu-btn" onclick="toggleMenu()"><div></div><div></div><div></div></div>

        <div class="side-menu" id="sideMenu">
            <button class="close-btn" onclick="toggleMenu()">×</button>
            <h3 style="margin-top:0; font-size:16px;">Варианты проверки</h3>
            <button class="btn" onclick="check('scam'); toggleMenu()">Проверить на скам</button>
            <button class="btn" onclick="check('fake'); toggleMenu()">Проверить на фейк</button>
            <button class="btn btn-main" onclick="check('all'); toggleMenu()">Полный анализ</button>
        </div>

        <h1>Fame Checker</h1>
        <p class="subtitle">Проверка аккаунтов по базам данных</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="Введите username">
        </div>

        <div class="badges">
            <div class="badge badge-fame" onclick="showList('fame')">Фейм</div>
            <div class="badge badge-fake" onclick="showList('fake')">Фейк</div>
            <div class="badge badge-scam" onclick="showList('scam')">Скам</div>
        </div>

        <div class="people-list" id="peopleList">
            <h3 style="font-size:14px; color:#aaa; margin-bottom:10px;">Список аккаунтов</h3>
            <div id="listContent"></div>
        </div>

        <div class="result-card" id="resultBox"></div>

        <div class="admin-panel" id="adminPanel">
            <h2>Панель владельца</h2>
            <button class="admin-btn">Принять жалобы</button>
            <button class="admin-btn">Выдать баланс</button>
            <button class="admin-btn">Сделать рассылку</button>
            <button class="admin-btn">Добавить метку</button>
            <button class="admin-btn">Убрать метку</button>
        </div>

        <div class="secret-login" id="secretLogin">
            <input type="password" id="adminPass" placeholder="Код доступа">
            <button class="btn" onclick="loginAdmin()">Войти</button>
        </div>
    </div>

    <script>
        // === АНИМАЦИЯ ЛЕПЕСТКОВ ===
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        let width, height; let petals = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Petal {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height - height;
                this.size = Math.random() * 8 + 4; this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 2 - 1; this.opacity = Math.random() * 0.5 + 0.3;
                this.angle = Math.random() * 360; this.spin = Math.random() * 2 - 1;
            }
            update() {
                this.y += this.speedY; this.x += Math.sin(this.y / 50) * 0.5 + this.speedX; this.angle += this.spin;
                if (this.y > height) { this.y = -20; this.x = Math.random() * width; }
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle * Math.PI / 180);
                ctx.beginPath(); ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 180, 200, ${this.opacity})`; ctx.fill(); ctx.restore();
            }
        }
        for (let i = 0; i < 50; i++) { petals.push(new Petal()); }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            petals.forEach(petal => { petal.update(); petal.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // === ЛОГИКА САЙТА ===
        const tg = window.Telegram.WebApp;
        tg.expand();

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }

        const API_URL = "https://fame-api-bs11.onrender.com/api/check"; 
        function check(type) {
            const username = document.getElementById('username').value.trim();
            const resultBox = document.getElementById('resultBox');
            if (!username) { alert("Введите ник"); return; }
            
            document.getElementById('peopleList').style.display = 'none';
            resultBox.style.display = 'block';
            resultBox.innerHTML = `<div>Поиск...</div>`;

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, type: type })
            })
            .then(res => res.json())
            .then(data => {
                let html = `<div style="font-weight:600; margin-bottom:10px;">@${data.username}</div>`;
                if (data.is_scam) html += `<div style="margin-bottom:6px; color:#ff2a2a;">Скам: ${data.scam_reason}</div>`;
                if (data.is_fake) html += `<div style="margin-bottom:6px; color:#ff2a2a;">Фейк: ${data.fake_reason}</div>`;
                if (!data.is_scam && !data.is_fake) html += `<div style="margin-bottom:6px;">В базах не найден.</div>`;
                resultBox.innerHTML = html;
            })
            .catch(error => {
                resultBox.innerHTML = `<span style="color:#ff2a2a;">Ошибка сервера.</span> Подождите.`;
            });
        }

        function showList(type) {
            document.getElementById('resultBox').style.display = 'none';
            const listDiv = document.getElementById('peopleList');
            const content = document.getElementById('listContent');
            listDiv.style.display = 'block';

            let html = '';
            if (type === 'fame') {
                html = `<div class="person"><span class="person-name">@doctor</span><span class="person-status status-fame">Фейм</span></div>`;
                html += `<button class="btn" style="margin-top:10px;">Купить Фейм за 5000 звезд</button>`;
            } else if (type === 'fake') {
                html = `<div class="person"><span class="person-name">@0ksy</span><span class="person-status status-fake">Фейк</span></div>`;
            } else if (type === 'scam') {
                html = `<div class="person"><span class="person-name">@bad_user</span><span class="person-status status-scam">Скам</span></div>`;
            }
            content.innerHTML = html;
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === "QWERTYUIOP(1234)a") {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('secretLogin').style.display = 'none'; 
                alert("Доступ разрешен");
            } else {
                alert("Неверный код");
            }
        }
    </script>
</body>
</html>
