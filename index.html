<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.15);
            --text: #ffffff; --accent: #0a84ff; --gold: #ffd60a; --green: #30d158; --red: #ff453a;
            --bg: #000000; --muted: #8e8e93; --msg-out: #0a84ff; --msg-in: rgba(255,255,255,0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at top right, #1a1a2e, #000000); }
        .glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 14px; }

        #mainApp { display: flex; height: 100%; flex-direction: column; }
        .header { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--glass); border-bottom: 1px solid var(--glass-border); }
        .header-title { font-size: 20px; font-weight: 700; }
        
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ЧАТЫ */
        .chat-item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-radius: 12px; margin-bottom: 5px; border-bottom: 1px solid var(--glass-border); }
        .chat-avatar { width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin-right: 15px; background: var(--accent); }
        .chat-info { flex: 1; }
        .chat-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .chat-msg { font-size: 14px; color: var(--muted); }

        /* ЭКРАН ЧАТА */
        #chatScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        .chat-header { padding: 15px; display: flex; align-items: center; background: var(--glass); border-bottom: 1px solid var(--glass-border); }
        .back-btn { font-size: 22px; cursor: pointer; margin-right: 15px; color: var(--accent); }
        .chat-title { font-size: 16px; font-weight: 600; }
        .messages-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 14px; max-width: 80%; font-size: 15px; }
        .msg.out { background: var(--msg-out); align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.in { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area { padding: 10px; display: flex; gap: 10px; background: var(--glass); border-top: 1px solid var(--glass-border); }
        .msg-input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; font-size: 15px; }
        .send-btn { background: var(--accent); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 16px; cursor: pointer; }

        /* ПРОФИЛЬ */
        .profile-card { padding: 20px; text-align: center; margin-bottom: 20px; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--accent); margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; }
        .info-row { display: flex; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--glass-border); font-size: 15px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--muted); }

        /* КАЗИНО */
        .casino-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .casino-tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--muted); }
        .casino-tab.active { background: var(--accent); color: white; }
        .game-box { padding: 20px; margin-bottom: 20px; text-align: center; }
        .modal-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 10px; color: white; margin-bottom: 10px; outline: none; text-align: center; font-size: 15px;}
        .btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--glass); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--glass-border); z-index: 10; }
        .nav-item { text-align: center; color: var(--muted); font-size: 11px; cursor: pointer; flex: 1; font-weight: 500; }
        .nav-item.active { color: var(--accent); }

        /* АДМИНКА */
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 9999; flex-direction: column; }
        .admin-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); }
        .admin-list { flex: 1; overflow-y: auto; padding: 15px; }
        .user-card { padding: 15px; margin-bottom: 15px; }
        .role-badge { padding: 3px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; background: #333; }
        .admin-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        .admin-btn { padding: 8px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: white; }
    </style>
</head>
<body>

    <div id="chatScreen">
        <div class="chat-header">
            <div class="back-btn" onclick="closeChat()">←</div>
            <div class="chat-title" id="chatTitle">Чат</div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-area">
            <input type="text" class="msg-input" id="msgInput" placeholder="Написать сообщение...">
            <button class="send-btn" onclick="sendMessage()">→</button>
        </div>
    </div>

    <div id="mainApp">
        <div class="header">
            <div class="header-title">Pepegram</div>
            <div id="adminBtn" style="cursor:pointer; font-size:20px; display:none; color:var(--gold);" onclick="openAdmin()">A</div>
        </div>

        <div class="content">
            <div class="tab-content active" id="tab-chats">
                <div class="chat-item glass" onclick="openChat('pepegram_chat')">
                    <div class="chat-avatar">P</div>
                    <div class="chat-info"><div class="chat-name">Pepegram Chat</div><div class="chat-msg">Общий чат</div></div>
                </div>
                <div class="chat-item glass" onclick="openChat('pepegram_channel')">
                    <div class="chat-avatar" style="background:var(--gold);">C</div>
                    <div class="chat-info"><div class="chat-name">Pepegram Channel</div><div class="chat-msg">Канал</div></div>
                </div>
            </div>

            <div class="tab-content" id="tab-profile">
                <div class="glass profile-card">
                    <div class="profile-avatar" id="profAvatar">D</div>
                    <h2 id="profileName">Загрузка...</h2>
                    <div id="roleText" style="color: var(--gold); font-size: 14px; font-weight: bold; margin-bottom: 15px;"></div>
                    <div class="info-row"><span class="info-label">ID</span><span id="profileId">...</span></div>
                    <div class="info-row"><span class="info-label">Звезды</span><span id="profileStars">0</span></div>
                    <div class="info-row"><span class="info-label">Граммы</span><span id="profileGrams">0</span></div>
                </div>
            </div>

            <div class="tab-content" id="tab-casino">
                <div class="casino-tabs">
                    <div class="casino-tab active" onclick="switchCasinoTab('crash')">Краш</div>
                    <div class="casino-tab" onclick="switchCasinoTab('roulette')">Рулетка</div>
                    <div class="casino-tab" onclick="switchCasinoTab('rocket')">Ракетка</div>
                </div>
                <div id="casino-crash" class="game-box glass">
                    <div style="font-size:18px; font-weight:bold; margin-bottom:15px;">Краш</div>
                    <input type="number" id="crashAmount" class="modal-input" placeholder="Сумма ставки">
                    <button class="btn" style="background:var(--green); color:#000;" onclick="playCrash()">Ставка</button>
                </div>
                <div id="casino-roulette" class="game-box glass" style="display:none;">
                    <div style="font-size:18px; font-weight:bold; margin-bottom:15px;">Рулетка</div>
                    <input type="number" id="rouletteAmount" class="modal-input" placeholder="Сумма ставки">
                    <button class="btn" style="background:var(--gold); color:#000;" onclick="playRoulette()">Крутить</button>
                </div>
                <div id="casino-rocket" class="game-box glass" style="display:none;">
                    <div style="font-size:18px; font-weight:bold; margin-bottom:15px;">Ракетка</div>
                    <input type="number" id="rocketAmount" class="modal-input" placeholder="Сумма ставки">
                    <button class="btn" style="background:var(--accent); color:#fff;" onclick="playRocket()">Запуск</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('chats', this)">Чаты</div>
            <div class="nav-item" onclick="switchTab('casino', this)">Казино</div>
            <div class="nav-item" onclick="switchTab('profile', this)">Профиль</div>
        </div>
    </div>

    <!-- АДМИН ПАНЕЛЬ -->
    <div id="adminPanel">
        <div class="admin-header">
            <div style="font-weight:bold; font-size:18px;">Панель Владельца</div>
            <button style="background:var(--red); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;" onclick="document.getElementById('adminPanel').style.display='none'">Закрыть</button>
        </div>
        <div class="admin-list" id="adminList"></div>
    </div>

    <script>
        const API_URL = "https://fame-api-bs11.onrender.com";
        const tg = window.Telegram.WebApp;
        tg.expand();
        const MY_TELEGRAM_ID = "1780245651"; 
        let currentUsername = "doctor";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username) {
            currentUsername = tg.initDataUnsafe.user.username;
        }
        let currentChat = "";

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if (element) element.classList.add('active');
        }

        function openChat(chatName) {
            currentChat = chatName;
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('chatTitle').innerText = chatName === 'pepegram_chat' ? 'Pepegram Chat' : 'Pepegram Channel';
            loadMessages();
        }
        function closeChat() { document.getElementById('chatScreen').style.display = 'none'; }
        function loadMessages() {
            const area = document.getElementById('messagesArea');
            area.innerHTML = "Загрузка...";
            fetch(API_URL + '/api/get_messages', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user1: currentUsername, user2: currentChat })
            }).then(res => res.json()).then(messages => {
                area.innerHTML = "";
                if (messages.length === 0) area.innerHTML = "Нет сообщений.";
                messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'msg ' + (m.sender === currentUsername ? 'out' : 'in');
                    div.innerText = m.text;
                    area.appendChild(div);
                });
                area.scrollTop = area.scrollHeight;
            });
        }
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            fetch(API_URL + '/api/send_message', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: currentUsername, receiver: currentChat, text: text })
            }).then(() => { input.value = ""; loadMessages(); });
        }

        function loadProfile() {
            fetch(API_URL + '/api/profile/' + currentUsername)
            .then(res => res.json())
            .then(data => {
                document.getElementById('profileName').innerText = data.username;
                document.getElementById('profileId').innerText = data.user_id;
                document.getElementById('profileStars').innerText = data.stars;
                document.getElementById('profileGrams').innerText = data.grams;
                const roleMap = { 'owner': 'Владелец', 'head_admin': 'Гл. Админ', 'admin': 'Админ', 'user': 'Игрок' };
                document.getElementById('roleText').innerText = roleMap[data.role] || 'Игрок';
                const myTgId = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : MY_TELEGRAM_ID;
                if (myTgId === MY_TELEGRAM_ID || data.user_id === MY_TELEGRAM_ID) {
                    document.getElementById('adminBtn').style.display = 'block';
                } else {
                    document.getElementById('adminBtn').style.display = 'none';
                }
            });
        }

        function playCrash() {
            const amount = parseInt(document.getElementById('crashAmount').value);
            if (!amount) return alert("Введите сумму");
            fetch(API_URL + '/api/casino/upgrader', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUsername, amount: amount }) })
            .then(res => res.json()).then(data => { alert(data.message || data.error); loadProfile(); });
        }
        function playRoulette() { alert("Рулетка (имитация)"); }
        function playRocket() { alert("Ракетка (имитация)"); }
        function switchCasinoTab(tab) {
            document.querySelectorAll('.casino-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.game-box').forEach(t => t.style.display = 'none');
            if (tab === 'crash') { document.getElementById('casino-crash').style.display = 'block'; event.target.classList.add('active'); }
            if (tab === 'roulette') { document.getElementById('casino-roulette').style.display = 'block'; event.target.classList.add('active'); }
            if (tab === 'rocket') { document.getElementById('casino-rocket').style.display = 'block'; event.target.classList.add('active'); }
        }

        // АДМИНКА
        function openAdmin() {
            document.getElementById('adminPanel').style.display = 'flex';
            loadAdminUsers();
        }
        function loadAdminUsers() {
            const list = document.getElementById('adminList');
            list.innerHTML = "Загрузка...";
            fetch(API_URL + '/api/admin/get_all')
            .then(res => res.json())
            .then(users => {
                list.innerHTML = "";
                users.forEach(u => {
                    const card = document.createElement('div');
                    card.className = 'glass user-card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <div style="font-weight:bold;">@${u.username}</div>
                            <div class="role-badge" style="background:${u.role === 'owner' ? 'var(--gold)' : 'var(--accent)'};">${u.role}</div>
                        </div>
                        <div style="font-size:13px; color:#aaa; margin-bottom:10px;">ID: ${u.user_id} | Звезды: ${u.stars} | Заморожен: ${u.is_frozen ? 'Да' : 'Нет'}</div>
                        <div class="admin-buttons">
                            <button class="admin-btn" style="background:var(--red);" onclick="adminAction('freeze', '${u.username}')">Заморозить</button>
                            <button class="admin-btn" style="background:var(--green);" onclick="adminAction('unfreeze', '${u.username}')">Разморозить</button>
                            <button class="admin-btn" style="background:var(--accent);" onclick="adminAction('give_stars', '${u.username}', 1000)">+1000 Звезд</button>
                            <button class="admin-btn" style="background:#555;" onclick="adminAction('set_role', '${u.username}', 'admin')">Дать Админа</button>
                            <button class="admin-btn" style="background:var(--gold); color: #000;" onclick="adminAction('set_role', '${u.username}', 'head_admin')">Дать Гл. Админа</button>
                            <button class="admin-btn" style="background:#333;" onclick="adminAction('set_role', '${u.username}', 'user')">Снять</button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            });
        }
        function adminAction(action, target, value = 0) {
            fetch(API_URL + '/api/admin/action', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action, target: target, value: value })
            }).then(res => res.json()).then(data => {
                alert(data.msg);
                loadAdminUsers();
            });
        }

        loadProfile();
    </script>
</body>
</html>
