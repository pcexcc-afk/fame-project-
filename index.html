<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f0f4f8; --card: #ffffff; --text: #1e293b; --muted: #64748b; 
            --accent: #0a84ff; --gold: #ffc53d; --green: #34c759; --red: #ff453a;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: 0.3s; }
        
        /* Темная тема (по желанию) */
        body.dark { --bg: #0e1621; --card: #17212b; --text: #ffffff; --muted: #8e8e93; --shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .glass { background: var(--card); box-shadow: var(--shadow); border-radius: 16px; border: 1px solid rgba(0,0,0,0.05); }

        /* АНИМАЦИЯ ЗВЕЗДОПАДА */
        #starsCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        #appScreen { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

        /* ЭКРАН ВХОДА */
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .logo { font-size: 60px; margin-bottom: 20px; color: var(--accent); }
        .auth-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .auth-subtitle { color: var(--muted); margin-bottom: 30px; }
        .input-group { width: 100%; max-width: 300px; }
        .input-group input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--muted); background: var(--card); color: var(--text); font-size: 18px; text-align: center; outline: none; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }

        /* ПРОФИЛЬ */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; font-weight: 700; }
        
        .profile-card { margin: 15px; padding: 20px; text-align: center; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; color: white; border: 4px solid transparent; }
        .avatar.frame-gold { border-color: var(--gold); box-shadow: 0 0 20px var(--gold); }
        .avatar.frame-neon { border-color: #bf5af2; box-shadow: 0 0 20px #bf5af2; }
        
        .profile-name { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .premium-badge { background: var(--gold); color: #000; font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 10px; margin-left: 5px; }
        
        .info-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 16px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--muted); }
        .info-value { font-weight: 600; }

        /* БАЛАНС TON */
        .ton-balance { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #0098EA, #0077B5); color: white; padding: 15px; border-radius: 16px; margin: 15px; }
        .ton-balance img { width: 30px; height: 30px; }
        .ton-balance b { font-size: 20px; }
        
        /* КАСТОМИЗАЦИЯ */
        .customization { margin: 15px; padding: 20px; }
        .color-picker { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 20px; }
        .color-circle { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .color-circle.active { border-color: var(--text); }
        
        .frame-picker { display: flex; gap: 10px; }
        .frame-btn { padding: 10px 15px; border-radius: 10px; border: 2px solid var(--muted); background: none; color: var(--text); cursor: pointer; }
        .frame-btn.active { border-color: var(--accent); background: rgba(10,132,255,0.1); }
    </style>
</head>
<body>

    <canvas id="starsCanvas"></canvas>

    <!-- ЭКРАН ВХОДА -->
    <div id="authScreen">
        <div class="logo">P</div>
        <div class="auth-title">Pepegram</div>
        <div class="auth-subtitle">Войдите по номеру телефона</div>
        <div class="input-group">
            <input type="text" id="phoneInput" placeholder="+7 999 123-45-67" readonly>
            <button class="btn" style="background: var(--muted); margin-bottom: 10px;" onclick="genPhone()">Сгенерировать номер</button>
            <button class="btn" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="appScreen" style="display: none;">
        <div class="header">
            <h1>Профиль</h1>
            <button class="btn" style="width: auto; padding: 10px 15px; background: var(--muted);" onclick="logout()">Выйти</button>
        </div>

        <div class="profile-card glass">
            <div class="avatar" id="avatarBox">U</div>
            <div class="profile-name">
                <span id="userName">Игрок</span>
                <span class="premium-badge">PREMIUM</span>
            </div>
            <div style="color: var(--muted); font-size: 14px; margin-top: 5px;" id="userId">ID: 000000</div>
        </div>

        <div class="ton-balance glass">
            <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" alt="TON">
            <b id="tonBalance">0 TON</b>
        </div>

        <div class="profile-card glass">
            <div class="info-row"><span class="info-label">Звезды</span><span class="info-value" id="starBalance">1000 ⭐</span></div>
            <div class="info-row"><span class="info-label">О себе</span><span class="info-value" id="userBio">-</span></div>
        </div>

        <div class="customization glass">
            <h3 style="margin-bottom: 10px;">Кастомизация</h3>
            <div style="font-size: 14px; color: var(--muted);">Цвет ника:</div>
            <div class="color-picker" id="colorPicker">
                <div class="color-circle" style="background: #1e293b;" onclick="setColor('#1e293b', this)"></div>
                <div class="color-circle" style="background: #0a84ff;" onclick="setColor('#0a84ff', this)"></div>
                <div class="color-circle" style="background: #34c759;" onclick="setColor('#34c759', this)"></div>
                <div class="color-circle" style="background: #ff453a;" onclick="setColor('#ff453a', this)"></div>
                <div class="color-circle" style="background: #bf5af2;" onclick="setColor('#bf5af2', this)"></div>
                <div class="color-circle" style="background: #ffc53d;" onclick="setColor('#ffc53d', this)"></div>
            </div>
            
            <div style="font-size: 14px; color: var(--muted);">Рамка аватарки:</div>
            <div class="frame-picker">
                <button class="frame-btn active" onclick="setFrame('none', this)">Нет</button>
                <button class="frame-btn" onclick="setFrame('gold', this)">Золото</button>
                <button class="frame-btn" onclick="setFrame('neon', this)">Неон</button>
            </div>
        </div>
    </div>

<script>
    const API_URL = "https://fame-api-bs11.onrender.com";
    let currentUser = null;

    // АНИМАЦИЯ ЗВЕЗДОПАДА
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    class Star {
        constructor() { this.reset(); this.y = Math.random() * h; }
        reset() {
            this.x = Math.random() * w; this.y = -10;
            this.size = Math.random() * 2 + 1;
            this.speed = Math.random() * 1.5 + 0.5;
            this.opacity = Math.random() * 0.6 + 0.4;
        }
        update() { this.y += this.speed; if (this.y > h) this.reset(); }
        draw() {
            ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }
    for (let i = 0; i < 100; i++) stars.push(new Star());
    function animate() {
        ctx.clearRect(0, 0, w, h);
        stars.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    // ЛОГИКА
    function genPhone() {
        document.getElementById('phoneInput').value = "+7 999 " + Math.floor(Math.random()*900+100) + "-" + Math.floor(Math.random()*90+10) + "-" + Math.floor(Math.random()*90+10);
    }

    async function login() {
        let phone = document.getElementById('phoneInput').value;
        if (!phone) phone = "+7 999 " + Math.floor(Math.random()*900+100); // Если пусто, генерим
        const uid = phone.replace(/\D/g, '') || Math.floor(1e9 + Math.random()*9e9);
        
        try {
            const res = await fetch(API_URL + '/api/user/' + uid);
            currentUser = await res.json();
            localStorage.setItem('pepegram_user_id', currentUser.id); // СОХРАНЯЕМ ID!
            showProfile();
        } catch (e) {
            alert("Сервер просыпается. Подождите 30 секунд и нажмите снова.");
        }
    }

    function showProfile() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'flex';
        
        document.getElementById('userName').innerText = currentUser.name;
        document.getElementById('userName').style.color = currentUser.nick_color;
        document.getElementById('avatarBox').innerText = currentUser.name[0].toUpperCase();
        document.getElementById('userId').innerText = "ID: " + currentUser.id;
        document.getElementById('starBalance').innerText = currentUser.stars + " ⭐";
        document.getElementById('tonBalance').innerText = currentUser.tons + " TON";
        
        // Рамка
        const av = document.getElementById('avatarBox');
        av.className = 'avatar';
        if (currentUser.frame === 'gold') av.classList.add('frame-gold');
        if (currentUser.frame === 'neon') av.classList.add('frame-neon');
    }

    let selColor = '#1e293b', selFrame = 'none';
    function setColor(c, el) {
        selColor = c;
        document.querySelectorAll('.color-circle').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('userName').style.color = c;
        saveProfile();
    }
    function setFrame(f, el) {
        selFrame = f;
        document.querySelectorAll('.frame-btn').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        const av = document.getElementById('avatarBox');
        av.className = 'avatar';
        if (f === 'gold') av.classList.add('frame-gold');
        if (f === 'neon') av.classList.add('frame-neon');
        saveProfile();
    }

    async function saveProfile() {
        if (!currentUser) return;
        currentUser.nick_color = selColor;
        currentUser.frame = selFrame;
        try {
            await fetch(API_URL + '/api/user/update', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(currentUser)
            });
        } catch(e) {}
    }

    function logout() {
        localStorage.removeItem('pepegram_user_id');
        location.reload();
    }

    // ПРИ ЗАГРУЗКЕ ПРОВЕРЯЕМ, ЕСТЬ ЛИ СОХРАНЕННЫЙ ID
    const savedId = localStorage.getItem('pepegram_user_id');
    if (savedId) {
        fetch(API_URL + '/api/user/' + savedId)
        .then(res => res.json())
        .then(data => { currentUser = data; showProfile(); })
        .catch(() => {});
    }
</script>
</body>
</html>
