<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepegram</title>
    <style>
        :root {
            --bg: #0e1621; --header: #17212b; --text: #ffffff; --text-muted: #7d8b99; --accent: #2ea6ff; --border: #101921;
            --gold: #e5b23b; --green: #4dff4d; --red: #ff2a2a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #mainApp { display: flex; height: 100%; flex-direction: column; }
        .header { background-color: var(--header); padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .header-title { font-size: 20px; font-weight: 600; color: var(--green); }
        .content { flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ПРОФИЛЬ */
        .profile-card { padding: 20px; text-align: center; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--green); margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; color: #000; border: 3px solid var(--gold); }
        .info-row { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 15px; }

        /* ЧАТЫ */
        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .chat-avatar { width: 55px; height: 55px; border-radius: 50%; background: #2ea6ff; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; margin-right: 15px; }

        /* КАЗИНО */
        .game-box { background: var(--header); margin: 15px; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
        .modal-input { width: 100%; padding: 12px; background: #242f3d; border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 10px; outline: none; text-align: center; font-size: 16px;}
        .modal-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 16px;}

        /* АДМИНКА (СПИСОК ИГРОКОВ) */
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; flex-direction: column; }
        .admin-header { background: var(--header); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .admin-list { flex: 1; overflow-y: auto; padding: 10px; }
        .admin-user-card { background: var(--header); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .admin-user-info { font-size: 14px; margin-bottom: 10px; line-height: 1.4; }
        .admin-actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .admin-action-btn { flex: 1; padding: 8px; font-size: 12px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--header); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 10px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--green); }
    </style>
</head>
<body>

    <div id="mainApp">
        <div class="header">
            <div class="header-title">Pepegram 🐸</div>
            <div style="cursor:pointer; font-size:20px;" onclick="openAdmin()">⚙️</div>
        </div>

        <div class="content">
            <!-- ЧАТЫ -->
            <div class="tab-content active" id="tab-chats">
                <div class="chat-item">
                    <div class="chat-avatar">П</div>
                    <div><div style="font-weight:600;">Павел Дуров</div><div style="font-size:13px; color:#7d8b99;">Добро пожаловать в Pepegram!</div></div>
                </div>
            </div>

            <!-- ПРОФИЛЬ -->
            <div class="tab-content" id="tab-profile">
                <div class="profile-card">
                    <div class="profile-avatar">D</div>
                    <h2 id="profileName">doctor</h2>
                    <div style="color:var(--gold); font-weight:bold; margin-bottom:10px;">⭐ Premium</div>
                    <div class="info-row"><span>ID</span><span id="profileId">...</span></div>
                    <div class="info-row"><span>Анонимный номер</span><span id="profileAnon">...</span></div>
                    <div class="info-row"><span>Звезды (⭐)</span><span id="profileStars" style="color:var(--gold);">0</span></div>
                    <div class="info-row"><span>Граммы (G)</span><span id="profileGrams" style="color:var(--green);">0</span></div>
                    <div class="info-row"><span>Тонны (TON)</span><span id="profileTons">0</span></div>
                </div>
            </div>

            <!-- КАЗИНО -->
            <div class="tab-content" id="tab-casino">
                <div class="game-box">
                    <div style="font-size:18px; font-weight:bold; margin-bottom:15px;">📈 Апгрейдер (x2)</div>
                    <input type="number" id="upgAmount" class="modal-input" placeholder="Сумма ставки">
                    <button class="modal-btn" style="background:var(--green); color:#000;" onclick="playUpgrader()">Апгрейд</button>
                </div>
                <div class="game-box">
                    <div style="font-size:18px; font-weight:bold; margin-bottom:15px;">🚀 Ракетка (x3)</div>
                    <input type="number" id="rocketAmount" class="modal-input" placeholder="Сумма ставки">
                    <button class="modal-btn" style="background:var(--gold); color:#000;" onclick="playRocket()">Запустить</button>
                </div>
            </div>

            <!-- НАСТРОЙКИ -->
            <div class="tab-content" id="tab-settings">
                <div style="padding:15px; border-bottom:1px solid var(--border); cursor:pointer;" onclick="alert('Обмен валют в Fragment')">
                    <span style="font-size:20px; margin-right:10px;">💎</span> Fragment
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('chats', this)">💬<br>Чаты</div>
            <div class="nav-item" onclick="switchTab('casino', this)">🎰<br>Казино</div>
            <div class="nav-item" onclick="switchTab('settings', this)">⚙️<br>Настройки</div>
            <div class="nav-item" onclick="switchTab('profile', this)">👤<br>Профиль</div>
        </div>
    </div>

    <!-- АДМИН ПАНЕЛЬ (СПИСОК ВСЕХ ИГРОКОВ) -->
    <div id="adminPanel">
        <div class="admin-header">
            <div style="font-weight:bold; font-size:18px;">Все игроки</div>
            <button style="background:var(--red); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;" onclick="document.getElementById('adminPanel').style.display='none'">Закрыть</button>
        </div>
        <div class="admin-list" id="adminList">
            <!-- Сюда загружаются игроки -->
        </div>
    </div>

    <script>
        const API_URL = "https://fame-api-bs11.onrender.com";
        const USERNAME = "doctor"; // Твой тестовый ник

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if (element) element.classList.add('active');
        }

        function loadProfile() {
            fetch(API_URL + '/api/profile/' + USERNAME)
            .then(res => res.json())
            .then(data => {
                document.getElementById('profileName').innerText = data.username;
                document.getElementById('profileId').innerText = data.user_id;
                document.getElementById('profileAnon').innerText = data.anon_number;
                document.getElementById('profileStars').innerText = data.stars;
                document.getElementById('profileGrams').innerText = data.grams;
                document.getElementById('profileTons').innerText = data.tons;
            }).catch(err => console.log("Сервер спит"));
        }

        function playUpgrader() {
            const amount = parseInt(document.getElementById('upgAmount').value);
            if (!amount) return alert("Введите сумму");
            fetch(API_URL + '/api/casino/upgrader', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: USERNAME, amount: amount })
            }).then(res => res.json()).then(data => { alert(data.message || data.error); loadProfile(); });
        }

        function playRocket() {
            const amount = parseInt(document.getElementById('rocketAmount').value);
            if (!amount) return alert("Введите сумму");
            fetch(API_URL + '/api/casino/rocket', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: USERNAME, amount: amount })
            }).then(res => res.json()).then(data => { alert(data.message || data.error); loadProfile(); });
        }

        // === АДМИН ПАНЕЛЬ ===
        function openAdmin() {
            let pass = prompt("Введите пароль владельца:");
            if (pass === "admin123") {
                document.getElementById('adminPanel').style.display = 'flex';
                loadAllUsers();
            }
        }

        function loadAllUsers() {
            const list = document.getElementById('adminList');
            list.innerHTML = "<div style='text-align:center; color:#888;'>Загрузка...</div>";
            
            fetch(API_URL + '/api/admin/get_all_users')
            .then(res => res.json())
            .then(users => {
                list.innerHTML = "";
                users.forEach(u => {
                    const card = document.createElement('div');
                    card.className = 'admin-user-card';
                    card.innerHTML = `
                        <div class="admin-user-info">
                            <b>@${u.username}</b> (ID: ${u.user_id || 'Нет'})<br>
                            ⭐ Звезды: ${u.stars} | 🟢 G: ${u.grams} | 💎 TON: ${u.tons}<br>
                            📱 Анон: ${u.anon_number} | Premium: ${u.is_premium ? '✅' : '❌'}
                        </div>
                        <div class="admin-actions">
                            <button class="admin-action-btn" style="background:var(--gold); color:#000;" onclick="giveCurrency('${u.username}', 'stars', 1000)">+1000 ⭐</button>
                            <button class="admin-action-btn" style="background:var(--green); color:#000;" onclick="giveCurrency('${u.username}', 'grams', 500)">+500 G</button>
                            <button class="admin-action-btn" style="background:var(--red); color:white;" onclick="alert('Бан пока в разработке')">Бан</button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            }).catch(err => list.innerHTML = "<div style='color:red;'>Ошибка загрузки. Сервер спит.</div>");
        }

        function giveCurrency(username, type, amount) {
            fetch(API_URL + '/api/admin/give_currency', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, type: type, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.msg || data.error);
                loadAllUsers(); // Обновляем список
                loadProfile();  // Обновляем свой профиль
            }).catch(err => alert("Сервер просыпается..."));
        }

        loadProfile();
    </script>
</body>
</html>
